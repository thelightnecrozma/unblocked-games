<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #0c0d14; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
  .top { display: flex; justify-content: space-between; width: 340px; margin-bottom: 12px; align-items: center; }
  .score { background: #1b1e2e; padding: 8px 14px; border-radius: 8px; font-weight: 700; }
  button { background: #7c3aed; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(4, 76px); gap: 8px; background: #1b1e2e; padding: 10px; border-radius: 12px; }
  .cell { width: 76px; height: 76px; background: #262a3d; border-radius: 8px; display: grid; place-items: center; font-size: 1.5rem; font-weight: 800; }
</style>
</head>
<body>
  <div class="top">
    <div class="score">Score: <span id="score">0</span></div>
    <button onclick="init()">New Game</button>
  </div>
  <div class="grid" id="grid"></div>
<script>
  let board, score;
  const colors = { 2:"#3b82f6", 4:"#6366f1", 8:"#8b5cf6", 16:"#a855f7", 32:"#ec4899", 64:"#f43f5e", 128:"#f59e0b", 256:"#10b981", 512:"#14b8a6", 1024:"#06b6d4", 2048:"#eab308" };
  function init() { board = Array(16).fill(0); score = 0; addTile(); addTile(); draw(); }
  function addTile() {
    const empty = board.map((v,i) => v === 0 ? i : -1).filter(i => i !== -1);
    if (empty.length) board[empty[Math.floor(Math.random()*empty.length)]] = Math.random() < 0.9 ? 2 : 4;
  }
  function draw() {
    document.getElementById("score").textContent = score;
    document.getElementById("grid").innerHTML = board.map(v =>
      `<div class="cell" style="background:${v ? (colors[v]||'#7c3aed') : '#262a3d'}">${v || ''}</div>`
    ).join("");
  }
  function slide(row) {
    let arr = row.filter(v => v);
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i+1]) { arr[i] *= 2; score += arr[i]; arr.splice(i+1, 1); }
    }
    while (arr.length < 4) arr.push(0);
    return arr;
  }
  function move(dir) {
    const prev = board.toString();
    for (let i = 0; i < 4; i++) {
      let idx = [0,1,2,3].map(j => dir < 2 ? i*4 + j : j*4 + i);
      if (dir === 1 || dir === 3) idx.reverse();
      let res = slide(idx.map(k => board[k]));
      idx.forEach((k, j) => board[k] = res[j]);
    }
    if (board.toString() !== prev) { addTile(); draw(); }
  }
  window.addEventListener("keydown", e => {
    if (["ArrowLeft","a","A"].includes(e.key)) move(0);
    if (["ArrowRight","d","D"].includes(e.key)) move(1);
    if (["ArrowUp","w","W"].includes(e.key)) move(2);
    if (["ArrowDown","s","S"].includes(e.key)) move(3);
  });
  init();
</script>
</body>
</html>
