<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #0c0d14; color: #fff; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
  canvas { border: 2px solid #0ea5e9; border-radius: 10px; background: #141622; cursor: pointer; }
  .hud { margin-bottom: 10px; font-weight: 700; }
</style>
</head>
<body>
  <div class="hud">Score: <span id="score">0</span> (Click or Space to Boost)</div>
  <canvas id="c" width="420" height="440"></canvas>
<script>
  const c = document.getElementById("c"), ctx = c.getContext("2d");
  let y = 200, vy = 0, pipes = [], frame = 0, score = 0;
  function flap() { vy = -6.5; }
  window.addEventListener("keydown", e => { if (e.code==="Space"||e.key==="ArrowUp") flap(); });
  c.addEventListener("mousedown", flap);
  function reset() { y=200; vy=0; pipes=[]; frame=0; score=0; document.getElementById("score").textContent=0; }
  function loop() {
    ctx.clearRect(0,0,420,440);
    vy += 0.35; y += vy;
    if (frame % 95 === 0) pipes.push({ x: 420, gapY: 80 + Math.random()*200, passed: false });
    pipes.forEach(p => {
      p.x -= 2.6;
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(p.x, 0, 48, p.gapY);
      ctx.fillRect(p.x, p.gapY + 125, 48, 440 - (p.gapY + 125));
      if (!p.passed && p.x + 48 < 80) { p.passed = true; score++; document.getElementById("score").textContent = score; }
      if (80+14 > p.x && 80-14 < p.x+48 && (y-14 < p.gapY || y+14 > p.gapY+125)) reset();
    });
    pipes = pipes.filter(p => p.x > -60);
    if (y > 440 || y < 0) reset();
    ctx.beginPath(); ctx.arc(80, y, 14, 0, Math.PI*2); ctx.fillStyle = "#fbbf24"; ctx.fill();
    frame++; requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
