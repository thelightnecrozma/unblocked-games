<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starforge — Unblocked Cosmic Arcade</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="brand"><div class="brand-icon">✦</div><span>Starforge</span></a>
    <div class="search-wrap"><span>🔍</span><input type="text" id="searchInput" placeholder="Search games..." autocomplete="off" /></div>
    <div class="nav-actions">
      <button id="navLoginBtn" class="tool-btn primary" style="border-radius:999px;padding:0.4rem 0.85rem;font-size:0.82rem;">Login with Google</button>
      <a href="profile.html" class="profile-chip"><span class="avatar-dot" id="navAvatar">🌌</span><span id="navName">Starforger</span></a>
      <a href="settings.html" class="icon-btn" title="Settings & Tab Cloak">⚙️</a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="categoryBar">
      <button class="cat-btn active" data-cat="All">🔥 Home</button>
      <button class="cat-btn" data-cat="Favorites">❤️ Favorites</button>
      <div class="sidebar-divider"></div>
      <button class="cat-btn" data-cat="Action">⚔️ Action</button>
      <button class="cat-btn" data-cat="Arcade">🕹️ Arcade</button>
      <button class="cat-btn" data-cat="Driving">🏎️ Driving</button>
      <button class="cat-btn" data-cat="Sports">⚽ Sports</button>
      <button class="cat-btn" data-cat="Puzzle">🧩 Puzzle</button>
      <div class="sidebar-bottom">
        <a href="profile.html" class="cat-btn">👤 Profile</a>
        <a href="settings.html" class="cat-btn">⚙️ Settings</a>
      </div>
    </aside>

    <main class="content">
      <div id="homeRows"></div>
      <div id="filteredView" style="display:none;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
          <h2 id="filteredTitle" style="font-size:1.25rem;font-weight:800;">Games</h2>
          <span class="count-pill" id="filteredCount">0</span>
        </div>
        <div class="game-grid" id="filteredGrid"></div>
      </div>
    </main>
  </div>

  <script src="core.js?v=4"></script>
  <script src="games.js?v=4"></script>
  <script>
    let activeCategory = "All";

    function cardHTML(game) {
      const isFav = getStore().favorites.includes(game.id);
      return `
        <div class="game-card">
          <button style="position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(12,13,20,0.82);border:1px solid rgba(255,255,255,0.16);color:${isFav ? "#f43f5e" : "#fff"};cursor:pointer;z-index:3;" onclick="event.preventDefault(); toggleFavorite('${game.id}'); renderPage();">${isFav ? "♥" : "♡"}</button>
          <a href="play.html?game=${encodeURIComponent(game.id)}" style="text-decoration:none;color:inherit;">
            <div class="card-thumb">
              ${game.badge ? `<span style="position:absolute;top:8px;left:8px;background:rgba(12,13,20,0.85);color:#fbbf24;font-size:0.68rem;font-weight:800;padding:0.2rem 0.5rem;border-radius:6px;z-index:2;">${game.badge}</span>` : ""}
              <img src="${game.cover}" alt="${game.title}" loading="lazy" />
            </div>
            <div class="card-body">
              <div style="min-width:0;"><div class="card-title">${game.title}</div><div class="card-cat">${game.category}</div></div>
              <div class="play-pill">▶</div>
            </div>
          </a>
        </div>`;
    }

    function makeRow(title, list) {
      return list.length ? `<section style="margin-bottom:1.85rem;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.85rem;"><h2 style="font-size:1.15rem;font-weight:800;">${title}</h2><span class="count-pill">${list.length}</span></div><div class="carousel">${list.map(cardHTML).join("")}</div></section>` : "";
    }

    function renderPage() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const homeRows = document.getElementById("homeRows");
      const filteredView = document.getElementById("filteredView");
      const store = getStore();

      if (activeCategory === "All" && !q) {
        homeRows.style.display = "block";
        filteredView.style.display = "none";
        const trending = GAMES.filter(g => g.trending);
        const nonTrending = GAMES.filter(g => !g.trending);

        homeRows.innerHTML =
          makeRow("🕒 Continue Playing", store.recent.map(id => GAMES.find(g => g.id === id)).filter(Boolean)) +
          makeRow("🔥 Trending on Starforge", trending) +
          makeRow("⚔️ Action & Driving", nonTrending.filter(g => g.category === "Action" || g.category === "Driving")) +
          makeRow("🕹️ Arcade, Sports & Puzzle", nonTrending.filter(g => ["Arcade", "Sports", "Puzzle"].includes(g.category)));
      } else {
        homeRows.style.display = "none";
        filteredView.style.display = "block";
        let list = activeCategory === "Favorites"
          ? store.favorites.map(id => GAMES.find(g => g.id === id)).filter(Boolean)
          : (activeCategory !== "All" ? GAMES.filter(g => g.category === activeCategory) : GAMES);
        if (q) list = list.filter(g => g.title.toLowerCase().includes(q) || g.category.toLowerCase().includes(q));
        document.getElementById("filteredTitle").textContent = q ? `Search: "${document.getElementById("searchInput").value}"` : `${activeCategory} Games`;
        document.getElementById("filteredCount").textContent = `${list.length} games`;
        document.getElementById("filteredGrid").innerHTML = list.length ? list.map(cardHTML).join("") : `<p style="color:var(--text-muted)">No games found here yet.</p>`;
      }
    }

    document.querySelectorAll(".cat-btn[data-cat]").forEach(btn => btn.addEventListener("click", () => {
      document.querySelectorAll(".cat-btn[data-cat]").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeCategory = btn.dataset.cat;
      renderPage();
    }));
    document.getElementById("searchInput").addEventListener("input", renderPage);
    renderPage();
  </script>
</body>
</html>
