<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play — Starforge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="brand"><div class="brand-icon">✦</div><span>Starforge</span></a>
    <div class="nav-actions">
      <a href="index.html" class="tool-btn">← Catalog</a>
      <a href="profile.html" class="profile-chip"><span class="avatar-dot" id="navAvatar">🌌</span><span id="navName">Starforger</span></a>
      <a href="settings.html" class="icon-btn">⚙️</a>
    </div>
  </header>

  <main class="content" style="margin-left:0; padding-top:1.25rem;">
    <div class="player-wrapper" id="playerWrapper">
      <div class="player-box">
        <iframe id="gameFrame" class="game-viewport" src="" allowfullscreen></iframe>
        <div class="player-bar">
          <div>
            <h1 id="gameTitle" style="font-size:1.2rem;font-weight:800;">Loading...</h1>
            <p id="gameCategory" style="font-size:0.82rem;color:var(--text-muted);"></p>
          </div>
          <div class="toolbar">
            <span id="sourceBadge" class="status-badge">💾 Local Self-Hosted</span>
            <button id="switchSourceBtn" class="tool-btn" style="display:none;">⚡ Switch to Local Backup</button>
            <button id="favBtn" class="tool-btn">♡ Favorite</button>
            <button id="reloadBtn" class="tool-btn">↻ Reload</button>
            <button id="theaterBtn" class="tool-btn">↔ Theater</button>
            <button id="fullscreenBtn" class="tool-btn primary">⛶ Fullscreen</button>
          </div>
        </div>
      </div>

      <div class="panel-card" style="margin-top:1rem;">
        <strong>Controls & Info:</strong> <span id="controlsText" style="color:var(--text-muted);"></span>
      </div>

      <div class="section-header" style="margin-top:2rem;"><h2>More Games on Starforge</h2></div>
      <div class="game-grid" id="moreGamesGrid"></div>
    </div>
  </main>

  <script src="core.js"></script>
  <script src="games.js"></script>
  <script>
    const game = GAMES.find(g => g.id === new URLSearchParams(window.location.search).get("game")) || GAMES[0];
    recordGameSession(game.id);

    const frame = document.getElementById("gameFrame"), sourceBadge = document.getElementById("sourceBadge"), switchBtn = document.getElementById("switchSourceBtn"), favBtn = document.getElementById("favBtn");
    document.title = `${game.title} — Starforge`;
    applyCloak();
    document.getElementById("gameTitle").textContent = game.title;
    document.getElementById("gameCategory").textContent = game.category;
    document.getElementById("controlsText").textContent = game.controls;

    function updateFavBtn() {
      const isFav = getStore().favorites.includes(game.id);
      favBtn.textContent = isFav ? "♥ Favorited" : "♡ Favorite";
      favBtn.style.borderColor = isFav ? "#f43f5e" : "var(--border)";
    }
    updateFavBtn();
    favBtn.addEventListener("click", () => { toggleFavorite(game.id); updateFavBtn(); });

    let usingEmbed = Boolean(getStore().settings.preferEmbed && game.embedUrl && game.embedUrl.trim() !== "");

    function loadSource(preferEmbed) {
      if (preferEmbed && game.embedUrl) {
        usingEmbed = true; frame.src = game.embedUrl;
        sourceBadge.textContent = "🌐 External Embed"; sourceBadge.className = "status-badge embed";
        switchBtn.style.display = "inline-flex"; switchBtn.textContent = "⚡ Switch to Local Backup";
      } else {
        usingEmbed = false; frame.src = game.localPath;
        sourceBadge.textContent = "💾 Local Self-Hosted"; sourceBadge.className = "status-badge";
        if (game.embedUrl) { switchBtn.style.display = "inline-flex"; switchBtn.textContent = "🌐 Try External Embed"; }
        else switchBtn.style.display = "none";
      }
    }

    frame.addEventListener("error", () => { if (usingEmbed && game.localPath) loadSource(false); });
    switchBtn.addEventListener("click", () => loadSource(!usingEmbed));
    document.getElementById("reloadBtn").addEventListener("click", () => { frame.src = frame.src; });
    document.getElementById("theaterBtn").addEventListener("click", () => document.getElementById("playerWrapper").classList.toggle("theater"));
    document.getElementById("fullscreenBtn").addEventListener("click", () => { if (frame.requestFullscreen) frame.requestFullscreen(); });

    document.getElementById("moreGamesGrid").innerHTML = GAMES.filter(g => g.id !== game.id).slice(0, 8).map(g => `
      <a href="play.html?game=${encodeURIComponent(g.id)}" class="game-card">
        <div class="card-thumb"><img src="${g.cover}" alt="${g.title}" /></div>
        <div class="card-body"><div><div class="card-title">${g.title}</div><div class="card-cat">${g.category}</div></div><div class="play-pill">▶</div></div>
      </a>`).join("");

    loadSource(usingEmbed);
  </script>
</body>
</html>
